  - name: mesc_wt_mouse
    cool_path: /home/mh-hannover.local/wolffjoa/data/hic-multiome/mouse_g9a/J1_25kb.cool
    bigwig_dir: /home/mh-hannover.local/wolffjoa/data/hic-multiome/mm10_tracks
