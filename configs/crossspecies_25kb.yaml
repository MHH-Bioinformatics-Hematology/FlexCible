capture:
  interactions: null
window:
  size: 128
  stride: 64
  transform: log1p
  clip_quantile: 0.999
  max_zero_fraction: 0.95
track:
  transform: log1p
  norm: zscore
model:
  base_channels: 48
  depth: 4
train:
  val_exclude_overlap: false   # trained before the honest default (2026-09-28)
  output_dir: runs/crossspecies_25kb
  cache_dir: cache/crossspecies_25kb
  batch_size: 16
  lr: 0.0003
  max_steps: 2000000
  max_minutes: 45
  eval_every: 200
  val_fraction: 0.1
  seed: 0
  augment_reverse: true
predict:
  merge: hann
