    zeroed_tracks:
    - H3K9me3
  resolution: 25000
  train_parity: odd
  test_parity: even
sequence:
  fasta: null
  features:
  - gc
  - cpg
  cache_dir: /home/mh-hannover.local/wolffjoa/data/hic-multiome/genome_cache
motifs:
