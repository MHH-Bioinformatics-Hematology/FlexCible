    missing_tracks:
    - SMC3
    zeroed_tracks:
    - RAD21
    - SMC3
window:
  size: 128
  stride: 64
  transform: log1p
  clip_quantile: 0.999
  max_zero_fraction: 0.95
track:
  transform: log1p
  norm: zscore
model:
  base_channels: 48
  depth: 4
train:
  batch_size: 16
  lr: 0.0003
  max_steps: 2000000
  max_minutes: 60
  eval_every: 150
  val_fraction: 0.1
  seed: 0
  output_dir: runs/multicell_25kb
  cache_dir: cache/multicell_25kb
capture:
  format: mifsud
  min_score: 0.0
  loss_weight: 0.5
motifs:
  dir: /home/mh-hannover.local/wolffjoa/data/hic-multiome/motifs
  score_frac: 0.8
  enabled: true
predict:
  merge: hann
sequence:
  fasta: /mnt/processed/wolffjoa/vardictcpp_validation_zenodo/reference/hg19.fa
  features:
  - gc
  - cpg
  cache_dir: /home/mh-hannover.local/wolffjoa/data/hic-multiome/genome_cache
