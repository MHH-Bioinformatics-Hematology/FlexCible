  norm: zscore
model:
  base_channels: 48
  depth: 4
train:
  val_exclude_overlap: false   # trained before the honest default (2026-09-28)
  output_dir: runs/flipseed1_25kb
  cache_dir: cache/multiome_25kb
  batch_size: 16
  lr: 0.0003
  max_steps: 200000
  max_minutes: 30
  eval_every: 150
  val_fraction: 0.1
  seed: 1
  augment_reverse: true
predict:
  merge: hann
  out_cool: runs/multiome_25kb/pred.cool
