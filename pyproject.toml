[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flexcible"
dynamic = ["version"]
description = "Flexible-input prediction of chromatin architecture from chromatin marks and a consensus matrix"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "Joachim Wolff"}]
dependencies = [
    "numpy",
    "pyyaml",
    "tqdm",
    "torch",
    "cooler",
    "pyBigWig",
    "pyfaidx",
    "scipy",
    "matplotlib",
]

[project.scripts]
flexcible = "flexcible.cli:main"

[tool.setuptools]
packages = ["flexcible"]

[tool.setuptools.dynamic]
version = {attr = "flexcible.__version__"}
